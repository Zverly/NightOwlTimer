name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci
      - run: npm run tauri build -- --bundles nsis,msi

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $installers = @(
            Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe",
            Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi"
          ) | Where-Object { $_ -and -not $_.PSIsContainer }
          if ($installers.Count -ne 2) { throw "Both NSIS and MSI installers are required" }
          $lines = $installers | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -Encoding ascii SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: CHANGELOG.md
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
            SHA256SUMS.txt
