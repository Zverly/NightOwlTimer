name: Bug 报告
description: 报告可重复的软件问题
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先确认问题可在最新版本中复现，并删除日志中的个人信息。

  - type: input
    id: version
    attributes:
      label: NightOwl 版本
      placeholder: 例如 0.1.1
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 24H2 x64
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供最小、可重复的操作步骤。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 可选。请先删除用户名、路径和任务历史等敏感信息。
