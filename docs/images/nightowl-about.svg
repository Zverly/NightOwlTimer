<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">NightOwl Timer 关于页面预览</title>
  <desc id="desc">关于页面展示版本、运行平台、GitHub 仓库和本地数据入口。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e1428"/><stop offset="1" stop-color="#202b5d"/></linearGradient></defs>
  <rect width="1280" height="820" rx="28" fill="url(#bg)"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" fill="#f4f5ff">
    <text x="62" y="70" font-size="18" fill="#aeb8df">‹</text><text x="92" y="70" font-size="15">返回设置</text>
    <rect x="260" y="82" width="760" height="650" rx="24" fill="#171e37" stroke="#3a4777"/>
    <circle cx="640" cy="170" r="48" fill="#292e5b"/><path d="M640 136a34 34 0 1 0 23 58l-9-13a19 19 0 1 1 4-28z" fill="#c9b8ff"/>
