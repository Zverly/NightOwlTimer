    <g font-size="15"><text x="316" y="350" fill="#9ca8d0">版本</text><text x="720" y="350" font-weight="700">v1.0.1</text><rect x="816" y="326" width="142" height="38" rx="10" fill="#6f68e8"/><text x="887" y="350" text-anchor="middle">检查更新</text>
